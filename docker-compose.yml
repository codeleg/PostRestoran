services:
  # ─────────────────────────────────────────────────────────
  # DATABASE TIER
  # ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:15.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # ─────────────────────────────────────────────────────────
  # CACHE TIER
  # ─────────────────────────────────────────────────────────
  redis:
    image: redis:7.2.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # ─────────────────────────────────────────────────────────
  # MIGRATION TIER (One-shot)
  # ─────────────────────────────────────────────────────────
  migration:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: development
    image: postrestoran-api:dev
    command: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3

  # ─────────────────────────────────────────────────────────
  # APPLICATION TIER
  # ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: development
    image: postrestoran-api:dev
    env_file:
      - .env.docker
    ports:
      - "3001:3001"
    volumes:
      - .:/app:cached
      - /app/apps/api/node_modules
      - /app/node_modules
      - api_dist:/app/apps/api/dist
    command: npm run dev --workspace=api
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.8'
      restart_policy:
        condition: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: development
    image: postrestoran-web:dev
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    volumes:
      - .:/app:cached
      - /app/apps/web/node_modules
      - /app/node_modules
      - web_next:/app/apps/web/.next
    command: npm run dev --workspace=web
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.8'
      restart_policy:
        condition: on-failure
    depends_on:
      api:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
    external: true
    name: docker_postgres_data
  redis_data:
    external: true
    name: docker_redis_data
  api_dist:
  web_next:
